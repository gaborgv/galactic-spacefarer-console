<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join the Galactic Adventure</title>
    <style>
      html,
      body,
      #content {
        height: 100%;
        margin: 0;
      }
    </style>
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/1.120.35/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-libs="sap.m,sap.ui.layout"
      data-sap-ui-resourceroots='{"galactic.spacefarers": "/galactic-spacefarers/webapp/"}'
      data-sap-ui-oninit="bootRegisterPage"
      data-sap-ui-flexibilityServices='""'
      data-sap-ui-compatVersion="edge"
      data-sap-ui-async="true"
    ></script>
    <script>
      function bootRegisterPage() {
        sap.ui.require(['sap/ui/core/mvc/XMLView'], function (XMLView) {
          XMLView.create({
            viewName: 'galactic.spacefarers.view.Register',
          }).then(function (view) {
            view.placeAt('content')
          })
        })
      }
    </script>
  </head>
  <body class="sapUiBody sapUiSizeCompact" id="content"></body>
</html>
